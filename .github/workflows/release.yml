# Builds a standalone Anchor executable for each platform and attaches them to
# the GitHub release. SEA cannot cross-compile, so each binary has to be built
# on its own OS — hence the matrix.
#
# Trigger:  git tag v1.0.0 && git push origin v1.0.0
name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:          # lets you build without cutting a release

permissions:
  contents: write             # needed to upload assets to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Anchor-windows.exe
          - os: macos-latest
            artifact: Anchor-macos
          - os: ubuntu-latest
            artifact: Anchor-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Single Executable Applications need 20+

      - name: Build
        run: node build.js

      - name: Smoke test
        shell: bash
        run: |
          # Run it from an empty directory to prove nothing external is needed.
          mkdir -p /tmp/smoke && cp "dist/${{ matrix.artifact }}" /tmp/smoke/
          cd /tmp/smoke
          ./${{ matrix.artifact }} --port 4567 --no-open --no-sync &
          PID=$!
          sleep 5
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4567/)
          css=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4567/assets/css/app.css)
          js=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4567/assets/js/app.js)
          kill $PID 2>/dev/null || true
          echo "index=$code css=$css js=$js"
          test "$code" = "200" && test "$css" = "200" && test "$js" = "200"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true          # review it before it goes out
          generate_release_notes: true
