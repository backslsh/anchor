# Publishes anchor-tracker to npmjs.com when a version tag is pushed.
#
# Deliberately npmjs.com rather than GitHub Packages: GitHub's npm registry
# makes consumers authenticate even for public packages, which would break
# `npx anchor-tracker` for everybody who is not already logged in.
#
# Setup, once:
#   1. Create an npm account and an *automation* access token
#      (npmjs.com → Access Tokens → Generate → Automation).
#      Automation tokens bypass 2FA, which classic tokens do not.
#   2. GitHub → Settings → Secrets and variables → Actions → New secret
#      Name: NPM_TOKEN     Value: the token
#
# Then:  npm version patch|minor|major   (this commits and tags)
#        git push && git push --tags
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # A tag that disagrees with package.json publishes the wrong version and
      # cannot be undone — npm forbids reusing a version number. Fail early.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json $PKG. Run 'npm version' instead of tagging by hand."
            exit 1
          fi

      - name: Smoke test the packed tarball
        run: |
          npm pack
          mkdir -p /tmp/verify && cd /tmp/verify && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/anchor-tracker-*.tgz
          node node_modules/anchor-tracker/serve.js --port 4599 --no-open --no-sync &
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4599/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4599/assets/js/app.js)" = "200"
          echo "tarball serves the app"

      # --provenance cryptographically ties the published package to this
      # commit and workflow. Worth having on a tool that asks for trust.
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
