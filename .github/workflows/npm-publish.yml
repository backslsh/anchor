name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # lets Actions mint the OIDC token npm verifies

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'                        # trusted publishing needs >= 22.14
          registry-url: 'https://registry.npmjs.org'

      # The npm bundled with Node 22 is 10.x; trusted publishing landed in 11.5.1.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm -v) on node $(node -v)"
          npm -v | node -e "
            let v=''; process.stdin.on('data',c=>v+=c).on('end',()=>{
              const [a,b,c2] = v.trim().split('.').map(Number);
              const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c2 >= 1)));
              if (!ok) { console.error('npm ' + v.trim() + ' is too old — trusted publishing needs >= 11.5.1'); process.exit(1); }
              console.log('npm ' + v.trim() + ' supports trusted publishing');
            });"

      # A tag that disagrees with package.json publishes the wrong version and
      # cannot be undone — npm forbids reusing a version number. Fail early.
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json $PKG. Use 'npm version' rather than tagging by hand."
            exit 1
          fi

      - name: Smoke test the packed tarball
        run: |
          npm pack
          mkdir -p /tmp/verify && cd /tmp/verify && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/anchor-tracker-*.tgz
          node node_modules/anchor-tracker/serve.js --port 4599 --no-open --no-sync &
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4599/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4599/assets/js/app.js)" = "200"
          echo "tarball serves the app"

      - name: Publish
        run: npm publish --access public
